<!-- 👣 RODAPÉ 3 — "Colorido": degradê roxo e rosa, com um botão para voltar ao topo.
     O rodapé é a última parte do site, como a assinatura no fim de uma carta.
     📋 Como usar: copie tudo e cole no index.html, embaixo de "ETAPA 4". -->

<!-- 👣 <footer> = o rodapé, com fundo em degradê.
     id="sobre" = o nome desta parte. É para cá que o link "Sobre" do menu leva. -->
<footer id="sobre" class="bg-gradient-to-r from-purple-700 via-fuchsia-600 to-pink-600 text-white">

    <!-- 📦 <div> = uma caixa. text-center = centraliza tudo. -->
    <div class="max-w-6xl mx-auto px-5 sm:px-6 py-14 text-center">

        <!-- ✦ Um quadradinho transparente (bg-white/20) com uma estrela. ✏️ Troque por um emoji! -->
        <div class="w-12 h-12 mx-auto rounded-2xl bg-white/20 flex items-center justify-center text-2xl">✦</div>

        <!-- 📰 <h2> = um subtítulo de despedida. ✏️ Pode trocar. -->
        <h2 class="mt-5 text-3xl font-black">Até o próximo post!</h2>

        <!-- 📝 <p> = um parágrafo contando quem fez o blog. ✏️ Escreva sobre vocês! -->
        <p class="max-w-xl mx-auto mt-3 text-white/80">
            Este blog foi criado por pessoas curiosas que decidiram experimentar o mundo da programação.
        </p>

        <!-- 🔘 <a> = um link com cara de botão que leva de volta ao topo (#inicio).
             hover:scale-105 = cresce um pouquinho quando o mouse passa em cima. -->
        <a href="#inicio" class="inline-block mt-7 bg-white text-purple-700 px-5 py-2.5 rounded-full font-bold hover:scale-105 transition">
            Voltar ao início ↑
        </a>
    </div>
</footer>
