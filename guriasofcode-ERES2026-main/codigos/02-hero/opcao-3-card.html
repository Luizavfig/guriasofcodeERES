<!-- 🌟 HERO 3 — "Card": um cartão branco grande, com texto e um lado colorido.
     A hero é a "capa" do site: a primeira parte grande que a pessoa vê.
     📋 Como usar: copie tudo e cole no index.html, embaixo de "ETAPA 2". -->

<!-- 🌟 <header> = o cabeçalho, a capa da página.
     id="inicio" = o nome desta parte. É para cá que o link "Início" do menu leva. -->
<header id="inicio" class="bg-purple-100 px-4 sm:px-6 py-10 sm:py-16">

    <!-- 💌 O cartão: fundo branco, cantos bem redondos (rounded-3xl) e sombra (shadow-xl). -->
    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">

        <!-- 📦 Divide o cartão em 5 partes iguais (lg:grid-cols-5), só no computador. -->
        <div class="grid lg:grid-cols-5">

            <!-- ⬅️ Lado do texto: ocupa 3 das 5 partes (lg:col-span-3). -->
            <div class="lg:col-span-3 p-8 sm:p-12 lg:p-16">

                <!-- 🏷️ <span> = um pedacinho de texto, aqui em rosa. ✏️ Pode trocar. -->
                <span class="text-pink-600 font-bold">BLOG • 2026</span>

                <!-- 📰 <h1> = o título mais importante da página, como a manchete de um jornal.
                     Use só UM <h1> no site todo. ✏️ Troque o título! -->
                <h1 class="mt-4 text-4xl sm:text-5xl font-black text-slate-900">
                    Um blog com a nossa personalidade.
                </h1>

                <!-- 📝 <p> = um parágrafo, um texto comum. ✏️ Escreva sobre o blog de vocês! -->
                <p class="mt-5 text-slate-600 text-lg leading-relaxed">
                    Escolha as cores, escreva sobre o que gosta e transforme este template no seu próprio projeto.
                </p>

                <!-- 🔘 <a> = um link com cara de botão. href="#posts" = leva até a parte dos posts. -->
                <a href="#posts" class="inline-block mt-8 bg-pink-600 hover:bg-pink-700 text-white px-6 py-3 rounded-xl font-bold">
                    Começar a explorar
                </a>
            </div>

            <!-- 🖼️ Lado da foto: ocupa 2 das 5 partes. A imagem puxa assets/hero/hero.png.
                 object-cover = a foto preenche o espaço sem ficar esticada.
                 ✏️ Quer outra foto? Salve por cima do arquivo hero.png (com o mesmo nome) e pronto! -->
            <img src="assets/hero/hero.png" alt="Imagem de capa do blog" class="lg:col-span-2 w-full h-full min-h-72 object-cover">
        </div>
    </div>
</header>
