<!-- 👣 RODAPÉ 2 — "Colunas": fundo escuro, informações divididas em 3 colunas.
     O rodapé é a última parte do site, como a assinatura no fim de uma carta.
     📋 Como usar: copie tudo e cole no index.html, embaixo de "ETAPA 4". -->

<!-- 👣 <footer> = o rodapé.
     id="sobre" = o nome desta parte. É para cá que o link "Sobre" do menu leva. -->
<footer id="sobre" class="bg-slate-950 text-white">

    <!-- 📦 Grade que divide o rodapé em colunas:
         📱 celular = 1 coluna | 📲 tablet = 2 | 💻 computador = 3. -->
    <div class="max-w-6xl mx-auto px-5 sm:px-6 py-12 grid sm:grid-cols-2 lg:grid-cols-3 gap-8">

        <!-- 1️⃣ Primeira coluna: nome e frase do blog. -->
        <div>
            <!-- 📰 <h2> = subtítulo com o nome do blog. ✏️ Troque! -->
            <h2 class="text-2xl font-black text-purple-300">Blog das Gurias</h2>
            <!-- 📝 <p> = parágrafo. ✏️ Troque a frase! -->
            <p class="mt-3 text-slate-400">Um espaço para criar e compartilhar.</p>
        </div>

        <!-- 2️⃣ Segunda coluna: links para voltar a outras partes da página. -->
        <div>
            <!-- 📰 <h3> = um título menor. -->
            <h3 class="font-bold">Navegação</h3>
            <!-- 📦 flex-col = coloca os links um embaixo do outro. -->
            <div class="mt-3 flex flex-col gap-2 text-slate-400">
                <!-- 🔗 <a> = links. hover:text-white = ficam brancos quando o mouse passa em cima. -->
                <a href="#inicio" class="hover:text-white">Início</a>
                <a href="#posts" class="hover:text-white">Posts</a>
            </div>
        </div>

        <!-- 3️⃣ Terceira coluna: as ferramentas que vocês usaram para fazer o blog. 🛠️ -->
        <div>
            <h3 class="font-bold">Tecnologias</h3>
            <p class="mt-3 text-slate-400">HTML • Tailwind CSS • JavaScript</p>
        </div>
    </div>

    <!-- 📝 Linha final com o ano. border-t = uma linha fininha em cima. ✏️ Pode trocar o texto. -->
    <div class="border-t border-slate-800 text-center text-xs text-slate-500 py-5">
        © 2026 • Feito durante nossa oficina
    </div>
</footer>
